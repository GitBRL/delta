# Ambiente local do Delta. Use ./bin/compose (funciona com ou sem o plugin "docker compose").
name: delta

x-php: &php
  build:
    context: ./infra/docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: delta-php:dev
  working_dir: /app
  environment:
    DB_PASSWORD: ${DELTA_APP_PASSWORD}
    DB_OWNER_PASSWORD: ${DELTA_OWNER_PASSWORD}
    REDIS_PASSWORD: ${VALKEY_PASSWORD}
  volumes:
    - ./backend:/app
    - composer-cache:/composer
    - ./infra/docker/php/conf.d/delta.ini:/usr/local/etc/php/conf.d/zz-delta.ini:ro
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      DELTA_OWNER_PASSWORD: ${DELTA_OWNER_PASSWORD:?defina no .env}
      DELTA_APP_PASSWORD: ${DELTA_APP_PASSWORD:?defina no .env}
      DELTA_ADMIN_PASSWORD: ${DELTA_ADMIN_PASSWORD:?defina no .env}
      DELTA_READONLY_PASSWORD: ${DELTA_READONLY_PASSWORD:?defina no .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delta_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.0-alpine
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --appendonly yes"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?defina no .env}
    volumes: [valkeydata:/data]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    ports: ["127.0.0.1:58025:8025"]

  # PDF dos relatórios (Chromium). Só na rede interna: a API chama http://gotenberg:3000.
  # Sem JavaScript e sem rede: o HTML é estático e só pode ler os próprios arquivos enviados.
  gotenberg:
    image: gotenberg/gotenberg:8.20.1
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --api-timeout=60s
      - --log-level=warn
    mem_limit: 1g

  api:
    <<: *php
    command: ["frankenphp", "php-server", "--root", "/app/public", "--listen", "0.0.0.0:8000"]
    ports: ["127.0.0.1:8000:8000"]
    # O healthcheck da imagem base consulta a admin API do Caddy (:2019), que o php-server não abre.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    healthcheck: { disable: true }

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    healthcheck: { disable: true }

volumes:
  pgdata:
  valkeydata:
  composer-cache:
